@keyframes ignite{0%{opacity:0;transform:scale(.2,.1)}60%{opacity:1;transform:scale(1.15,1.25)}100%{opacity:1;transform:scale(1,1)}}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(-1deg)}20%{transform:scale(.94,1.08) rotate(1.5deg)}45%{transform:scale(1.04,.95) rotate(-2deg)}70%{transform:scale(.97,1.06) rotate(1deg)}85%{transform:scale(1.02,.98) rotate(-.5deg)}}

@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-240px) scale(1.1);opacity:0}}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0deg);opacity:0}10%{opacity:.95}90%{opacity:.9}100%{transform:translate(var(--dx),520px) rotate(var(--spin));opacity:0}}
@keyframes shimmer{0%{background-position:200% 50%}100%{background-position:-200% 50%}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(10px);opacity:1}}
@keyframes sway{from{transform:rotate(calc(var(--rot) - 6deg))}to{transform:rotate(calc(var(--rot) + 6deg))}}

@keyframes menorahIn{from{opacity:.35;transform:perspective(1100px) rotateX(32deg) scale(.86) translateY(40px)}to{opacity:1;transform:perspective(1100px) rotateX(0deg)}}

@keyframes photoLight{from{filter:brightness(.42) saturate(.55)}to{filter:brightness(1.06) saturate(1.08)}}

.fu{animation:fadeUp 1.1s cubic-bezier(.2,.7,.2,1) both}
.flame{transform-origin:50% 100%;animation:flicker 2.4s ease-in-out infinite;animation-delay:var(--f)}
.fglow{animation:glowPulse 2.8s ease-in-out infinite;animation-delay:var(--f)}
.spark{animation:rise var(--t) ease-out infinite;animation-delay:var(--sd)}
.petal{animation:fall var(--t) linear infinite;animation-delay:var(--sd)}
.shine{background:linear-gradient(100deg,#8A5A12 0%,#8A5A12 35%,#D9A441 50%,#8A5A12 65%,#8A5A12 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
.glint{animation:glint 3.2s ease-in-out infinite;animation-delay:var(--gd)}
.sway-soft{animation:swaySoft var(--sw) ease-in-out infinite alternate}
.cue{animation:bob 1.8s ease-in-out infinite}
.sway{transform-origin:50% 85%;animation:sway var(--sw) ease-in-out infinite alternate}
.petals{transform-origin:50px 50px;animation:breathe 4s ease-in-out infinite}

/* time-based fallback */
.flame-wrap{transform-origin:0 0;animation:ignite .9s cubic-bezier(.2,.8,.3,1.2) var(--d) both}
.bloom{animation:bloom 1.4s cubic-bezier(.2,.8,.3,1.1) var(--bd) both}
.halo{transform:translateX(-50%)}
.cap{display:none}
.cap-final{display:block}

/* scroll-driven effects */
@supports (animation-timeline: view()){
  .hero-in{animation:heroOut linear both;animation-timeline:view();animation-range:exit 0% exit 90%}
  .light-track{view-timeline:--menorah block}
  .flame-wrap{animation:ignite linear both;animation-timeline:--menorah;animation-range:contain var(--r0) contain var(--r1)}
  .halo{animation:haloGrow linear both;animation-timeline:--menorah;animation-range:contain 0% contain 85%}
  .menorah-in{animation:menorahIn linear both;animation-timeline:--menorah;animation-range:entry 20% contain 0%}
  .cap{display:block;position:absolute;inset:0;opacity:0;animation:captionSwap linear both;animation-timeline:--menorah}
  .cap-1{animation-range:contain 0% contain 30%}
  .cap-2{animation-range:contain 30% contain 62%}
  .cap-final{animation:fadeUp linear both;animation-timeline:--menorah;animation-range:contain 62% contain 80%}
  .bloom-m{animation:bloom linear both;animation-timeline:--menorah;animation-range:contain 60% contain 88%}
  .bloom-v{animation:bloom linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
  .glint{animation:glint linear both;animation-timeline:view();animation-range:cover var(--g0) cover var(--g1)}
  .photo-lit{animation:photoLight linear both;animation-timeline:--menorah;animation-range:contain 0% contain 72%}
  .reveal{animation:revealUp linear both;animation-timeline:view();animation-range:entry 5% cover 35%}
  .glow-end{animation:bigGlow linear both;animation-timeline:view();animation-range:entry 0% cover 50%}
}
@media (prefers-reduced-motion: reduce){
  .flame,.fglow,.spark,.glint,.sway-soft,.petal,.shine,.cue,.sway,.petals{animation:none}
}

<script src="assets/three.min.js"></script>
<script>
(function(){
  var self={ canvasEl: document.getElementById('bg3d') };
  self._init3D=function(){
    var self = this;
    var THREE = window.THREE;
    var canvas = this.canvasEl;
    if (!canvas || this._renderer || this._dead) return;
    if (!THREE) { this._tries = (this._tries || 0) + 1; if (this._tries < 60) setTimeout(function () { self._init3D(); }, 100); return; }
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true }); } catch (e) { return; }
    this._renderer = renderer;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 0, 10);
    scene.add(new THREE.AmbientLight(0xfff1d6, 1.1));
    var key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 6, 8); scene.add(key);
    var rim = new THREE.DirectionalLight(0xffc477, 1.4); rim.position.set(-6, -2, 4); scene.add(rim);
    var warm = new THREE.PointLight(0xffb347, 30, 30); scene.add(warm);

    var SPAN = 34;
    function rnd(k) { var v = Math.sin(k * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }

    // textures
    function letterTex(ch) {
      var c = document.createElement('canvas'); c.width = c.height = 256;
      var g = c.getContext('2d');
      var gr = g.createLinearGradient(0, 0, 256, 256);
      gr.addColorStop(0, '#F6D98E'); gr.addColorStop(0.5, '#D9A441'); gr.addColorStop(1, '#A8741A');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = 'rgba(255,240,200,.8)'; g.lineWidth = 10; g.strokeRect(14, 14, 228, 228);
      g.fillStyle = '#4A2E0C'; g.font = '900 170px "Frank Ruhl Libre", serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, 128, 140);
      var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    function glowTex() {
      var c = document.createElement('canvas'); c.width = c.height = 64;
      var g = c.getContext('2d');
      var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,226,150,.9)');
      gr.addColorStop(0.6, 'rgba(255,180,70,.25)'); gr.addColorStop(1, 'rgba(255,170,60,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    var gold = new THREE.MeshStandardMaterial({ color: 0xE0A93E, metalness: 0.75, roughness: 0.28, emissive: 0x3a2200, emissiveIntensity: 0.35 });
    var goldLight = new THREE.MeshStandardMaterial({ color: 0xF4CF7A, metalness: 0.6, roughness: 0.3, emissive: 0x402a00, emissiveIntensity: 0.3 });
    var letters = ['נ', 'ג', 'ה', 'פ'].map(function (ch) { return new THREE.MeshStandardMaterial({ map: letterTex(ch), metalness: 0.35, roughness: 0.4 }); });

    function makeDreidel() {
      var grp = new THREE.Group();
      var body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), [letters[0], letters[2], gold, gold, letters[1], letters[3]]);
      grp.add(body);
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.71, 0.75, 4, 1), gold);
      tip.rotation.y = Math.PI / 4; tip.rotation.x = Math.PI; tip.position.y = -0.875; grp.add(tip);
      var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.08, 24), goldLight); cap.position.y = 0.54; grp.add(cap);
      var handle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.6, 16), goldLight); handle.position.y = 0.86; grp.add(handle);
      var knob = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), goldLight); knob.position.y = 1.18; grp.add(knob);
      return grp;
    }
    function makeStar() {
      var shape1 = new THREE.Shape(), shape2 = new THREE.Shape();
      for (var k = 0; k < 3; k++) {
        var a1 = Math.PI / 2 + k * 2 * Math.PI / 3, a2 = -Math.PI / 2 + k * 2 * Math.PI / 3;
        if (k === 0) { shape1.moveTo(Math.cos(a1), Math.sin(a1)); shape2.moveTo(Math.cos(a2), Math.sin(a2)); }
        else { shape1.lineTo(Math.cos(a1), Math.sin(a1)); shape2.lineTo(Math.cos(a2), Math.sin(a2)); }
      }
      var hole1 = new THREE.Path(), hole2 = new THREE.Path();
      for (var j = 0; j < 3; j++) {
        var b1 = Math.PI / 2 + j * 2 * Math.PI / 3, b2 = -Math.PI / 2 + j * 2 * Math.PI / 3;
        if (j === 0) { hole1.moveTo(0.78 * Math.cos(b1), 0.78 * Math.sin(b1)); hole2.moveTo(0.78 * Math.cos(b2), 0.78 * Math.sin(b2)); }
        else { hole1.lineTo(0.78 * Math.cos(b1), 0.78 * Math.sin(b1)); hole2.lineTo(0.78 * Math.cos(b2), 0.78 * Math.sin(b2)); }
      }
      shape1.holes.push(hole1); shape2.holes.push(hole2);
      var opts = { depth: 0.14, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.03, bevelSegments: 2 };
      var grp = new THREE.Group();
      var m1 = new THREE.Mesh(new THREE.ExtrudeGeometry(shape1, opts), gold);
      var m2 = new THREE.Mesh(new THREE.ExtrudeGeometry(shape2, opts), gold); m2.position.z = 0.02;
      grp.add(m1); grp.add(m2);
      return grp;
    }
    function makeCoin() {
      var grp = new THREE.Group();
      var coin = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.09, 40), goldLight);
      coin.rotation.x = Math.PI / 2; grp.add(coin);
      var rimM = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.045, 10, 40), gold); grp.add(rimM);
      return grp;
    }

    // place objects: nx is a fraction of the visible half-width at its depth
    var items = [];
    var kinds = ['dreidel', 'star', 'coin', 'dreidel', 'coin', 'star', 'dreidel', 'coin', 'star', 'dreidel', 'coin', 'star'];
    for (var q = 0; q < kinds.length; q++) {
      var kind = kinds[q];
      var obj = kind === 'dreidel' ? makeDreidel() : (kind === 'star' ? makeStar() : makeCoin());
      var side = q % 2 === 0 ? -1 : 1;
      var z = -1.5 - rnd(q) * 4;
      var sc = (kind === 'dreidel' ? 0.85 : 0.7) * (0.8 + rnd(q + 9) * 0.5);
      obj.scale.setScalar(sc);
      obj.rotation.set(rnd(q + 3) * 0.6 - 0.3, rnd(q + 4) * 6, rnd(q + 5) * 0.5 - 0.25);
      scene.add(obj);
      items.push({ obj: obj, kind: kind, sc: sc, nx: side * (0.72 + rnd(q + 1) * 0.22), y: 1.5 - (q / (kinds.length - 1)) * (SPAN + 1) + (rnd(q + 2) - 0.5) * 1.5, z: z, ph: rnd(q + 6) * 6.28, sp: 0.4 + rnd(q + 7) * 0.6 });
    }

    // particles
    var N = 420, pos = new Float32Array(N * 3);
    for (var n = 0; n < N; n++) {
      pos[n * 3] = (rnd(n + 50) - 0.5) * 18;
      pos[n * 3 + 1] = 4 - rnd(n + 80) * (SPAN + 10);
      pos[n * 3 + 2] = -9 + rnd(n + 110) * 10;
    }
    var pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var pm = new THREE.PointsMaterial({ size: 0.22, map: glowTex(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd68a, opacity: 0.9 });
    var points = new THREE.Points(pg, pm); scene.add(points);
    var pm2 = new THREE.PointsMaterial({ size: 0.45, map: pm.map, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffb04a, opacity: 0.55 });
    var pg2 = new THREE.BufferGeometry(); var pos2 = new Float32Array(90 * 3);
    for (var m = 0; m < 90; m++) { pos2[m * 3] = (rnd(m + 300) - 0.5) * 20; pos2[m * 3 + 1] = 4 - rnd(m + 330) * (SPAN + 10); pos2[m * 3 + 2] = -12 + rnd(m + 360) * 8; }
    pg2.setAttribute('position', new THREE.BufferAttribute(pos2, 3));
    var points2 = new THREE.Points(pg2, pm2); scene.add(points2);

    var W = 1, H = 1;
    function resize() {
      W = window.innerWidth || canvas.clientWidth || 1; H = window.innerHeight || canvas.clientHeight || 1;
      renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
    }
    resize();
    var px = 0, py = 0, tx = 0, ty = 0, scrollP = 0, camY = 0;
    function onMove(e) { var p = e.touches ? e.touches[0] : e; tx = (p.clientX / W - 0.5) * 2; ty = (p.clientY / H - 0.5) * 2; }
    function onScroll() {
      var el = document.scrollingElement || document.documentElement;
      var max = Math.max(1, el.scrollHeight - window.innerHeight);
      scrollP = Math.min(1, Math.max(0, (window.scrollY || el.scrollTop) / max));
    }
    function onTilt(e) { if (e.gamma != null) { tx = Math.max(-1, Math.min(1, e.gamma / 30)); ty = Math.max(-1, Math.min(1, ((e.beta || 45) - 45) / 30)); } }
    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('deviceorientation', onTilt, { passive: true });
    onScroll();
    this._cleanup = function () {
      window.removeEventListener('resize', resize); window.removeEventListener('pointermove', onMove);
      window.removeEventListener('touchmove', onMove); window.removeEventListener('scroll', onScroll);
      window.removeEventListener('deviceorientation', onTilt);
    };
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var clock = new THREE.Clock();
    var halfTan = Math.tan(THREE.MathUtils.degToRad(25));
    function frame() {
      if (self._dead) return;
      self._raf = requestAnimationFrame(frame);
      if (document.hidden) return;
      var t = reduce ? 0 : clock.getElapsedTime();
      px += (tx - px) * 0.05; py += (ty - py) * 0.05;
      var targetY = -scrollP * SPAN;
      camY += (targetY - camY) * 0.08;
      camera.position.set(px * 0.9 + Math.sin(t * 0.3) * 0.15, camY - py * 0.5, 10);
      camera.lookAt(px * 0.2, camY, 0);
      warm.position.set(0, camY + 1, 4);
      for (var k = 0; k < items.length; k++) {
        var it = items[k], o = it.obj;
        var half = halfTan * (10 - it.z) * camera.aspect;
        var narrow = camera.aspect < 0.8;
        var nx = narrow ? (it.nx < 0 ? -1 : 1) * Math.max(Math.abs(it.nx), 0.97) : it.nx;
        o.scale.setScalar(it.sc * (narrow ? 0.62 : 1));
        o.position.set(nx * half, it.y + Math.sin(t * it.sp + it.ph) * 0.25, it.z);
        if (it.kind === 'dreidel') { o.rotation.y = t * (1.4 + it.sp) + it.ph; o.rotation.z = Math.sin(t * 1.3 + it.ph) * 0.12; }
        else if (it.kind === 'coin') { o.rotation.y = t * (1.1 + it.sp) + it.ph; o.rotation.x = Math.sin(t * 0.7 + it.ph) * 0.3; }
        else { o.rotation.y = Math.sin(t * 0.6 + it.ph) * 0.9; o.rotation.z = t * 0.25 + it.ph; }
      }
      points.rotation.y = Math.sin(t * 0.05) * 0.15;
      pm.opacity = 0.75 + Math.sin(t * 2.1) * 0.15;
      points2.position.y = Math.sin(t * 0.2) * 0.3;
      renderer.render(scene, camera);
    }
    frame();
  };
  self._init3D();
})();
